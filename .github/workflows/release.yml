name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v2.2.6)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Get tag commit date
        id: tagdate
        shell: bash
        run: echo "date=$(git log -1 --format=%cd --date=short)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Self-contained — includes .NET runtime, just works
      - name: Publish (self-contained)
        run: >
          dotnet publish app/ControllerManager.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -o publish-sc

      # Framework-dependent — requires .NET 10 Desktop Runtime, much smaller
      - name: Publish (slim / framework-dependent)
        run: >
          dotnet publish app/ControllerManager.csproj
          -c Release -r win-x64 --no-self-contained
          -p:PublishSingleFile=true
          -o publish-fd

      - name: Rename slim build
        run: Rename-Item publish-fd\ControllerManager.exe ControllerManager-slim.exe

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            publish-sc/ControllerManager.exe
            publish-fd/ControllerManager-slim.exe
          generate_release_notes: true
          overwrite_files: true
          body: |
            > Originally released ${{ steps.tagdate.outputs.date }}

            ## Downloads

            | File | Description |
            |------|-------------|
            | `ControllerManager.exe` | ✅ Recommended — includes .NET runtime, just run it |
            | `ControllerManager-slim.exe` | Requires [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) — much smaller |
