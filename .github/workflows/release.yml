name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish WPF app
        run: dotnet publish app/HIDReorder.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/HIDReorder.exe
          generate_release_notes: true
          overwrite: true
