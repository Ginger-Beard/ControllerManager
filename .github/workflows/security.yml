name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Weekly Monday 08:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── CodeQL static analysis ──────────────────────────────────────────────────
  codeql:
    name: CodeQL (C#)
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-and-quality
          config: |
            paths-ignore:
              - '**/obj/**'
            # Quality-rule suppressions (security rules are unaffected):
            #   unmanaged-code/call-to-unmanaged-code — P/Invoke is core to this
            #     Windows hardware app (HidHide IOCTL, ETW, HID, WScript COM);
            #     these rules just count call sites.
            #   catch-of-all-exceptions / empty-catch-block — intentional
            #     best-effort swallow during cleanup/Dispose paths (mutex
            #     release, file delete on shutdown, ETW unsubscribe, etc.).
            #   missed-using-statement — flags intentional try/finally Dispose
            #     patterns used to guard partial-init failure (LaunchOrchestrator).
            #   path-combine — Path.Combine style preference; no security risk.
            #   linq/missed-where + linq/missed-select — style preference for
            #     foreach+continue → .Where(); refactoring obscures the loop body.
            query-filters:
              - exclude:
                  id: cs/call-to-unmanaged-code
              - exclude:
                  id: cs/unmanaged-code
              - exclude:
                  id: cs/catch-of-all-exceptions
              - exclude:
                  id: cs/empty-catch-block
              - exclude:
                  id: cs/missed-using-statement
              - exclude:
                  id: cs/path-combine
              - exclude:
                  id: cs/linq/missed-where
              - exclude:
                  id: cs/linq/missed-select

      - name: Build for CodeQL
        run: dotnet build app/ControllerManager.csproj -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp

  # ── NuGet dependency vulnerability check ────────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore app/ControllerManager.csproj

      - name: Audit for vulnerable packages
        shell: pwsh
        run: |
          $output = dotnet list app/ControllerManager.csproj package --vulnerable --include-transitive 2>&1
          Write-Host $output
          if (($output -join "`n") -match "has the following vulnerable packages") {
            Write-Error "Vulnerable NuGet packages detected — review output above."
            exit 1
          }
          Write-Host "No vulnerable packages found."
